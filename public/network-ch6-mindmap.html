<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="408计算机网络第6章应用层考纲与真题交互思维导图，支持遮罩自测与原笔记锚点跳转。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23315f4d'/><text x='12' y='16.5' text-anchor='middle' font-size='12' fill='%23f5f3ed' font-family='sans-serif'>6</text></svg>">
  <title>第6章 应用层 · 考纲与真题交互导图</title>
  <script src="study/theme-boot.js?v=1"></script>
  <link rel="stylesheet" href="study/app.css?v=1">
  <style>
    :root {
      --mm-red: #b5412b;
      --mm-red-bg: rgba(181, 65, 43, 0.11);
      --mm-red-bd: rgba(181, 65, 43, 0.34);
      --mm-amber: #9b6016;
      --mm-amber-bg: rgba(155, 96, 22, 0.11);
      --mm-amber-bd: rgba(155, 96, 22, 0.34);
      --mm-blue: #165a78;
      --mm-blue-bg: rgba(22, 90, 120, 0.11);
      --mm-blue-bd: rgba(22, 90, 120, 0.34);
      --mm-line: rgba(102, 118, 109, 0.38);
      --mm-shadow: 0 8px 24px rgba(24, 38, 30, 0.06);
    }
    html[data-theme="dark"] {
      --mm-red: #f29b82;
      --mm-red-bg: rgba(242, 155, 130, 0.14);
      --mm-red-bd: rgba(242, 155, 130, 0.38);
      --mm-amber: #ecc27d;
      --mm-amber-bg: rgba(236, 194, 125, 0.14);
      --mm-amber-bd: rgba(236, 194, 125, 0.36);
      --mm-blue: #91d4e9;
      --mm-blue-bg: rgba(145, 212, 233, 0.14);
      --mm-blue-bd: rgba(145, 212, 233, 0.36);
      --mm-line: rgba(167, 183, 168, 0.34);
      --mm-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }
    html[data-theme="glass"] {
      --mm-red: #ff9c94;
      --mm-red-bg: rgba(255, 156, 148, 0.16);
      --mm-red-bd: rgba(255, 156, 148, 0.42);
      --mm-amber: #f7ce7e;
      --mm-amber-bg: rgba(247, 206, 126, 0.16);
      --mm-amber-bd: rgba(247, 206, 126, 0.4);
      --mm-blue: #6be0ff;
      --mm-blue-bg: rgba(107, 224, 255, 0.15);
      --mm-blue-bd: rgba(107, 224, 255, 0.38);
      --mm-line: rgba(226, 236, 244, 0.34);
      --mm-shadow: 0 16px 36px rgba(3, 8, 15, 0.38);
    }
    html[data-theme="mono"] {
      --mm-red: #111;
      --mm-red-bg: #efefef;
      --mm-red-bd: #222;
      --mm-amber: #333;
      --mm-amber-bg: #f5f5f5;
      --mm-amber-bd: #888;
      --mm-blue: #444;
      --mm-blue-bg: #fafafa;
      --mm-blue-bd: #aaa;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }
    .mm-shell {
      max-width: 1560px;
      margin: 0 auto;
      padding: 16px 24px 48px;
    }
    .mm-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }
    .mm-nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mm-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      font-size: 12px;
      color: var(--ink);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .mm-nav-btn:hover {
      background: var(--soft);
      border-color: var(--green);
      color: var(--green);
    }
    .mm-nav-btn .icon {
      width: 15px;
      height: 15px;
    }
    .mm-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .mm-title-wrap h1 {
      font-size: 28px;
      margin: 4px 0 6px;
      letter-spacing: 0.5px;
    }
    .mm-subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .mm-progress-box {
      min-width: 260px;
      flex: 0 1 340px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--mm-shadow);
    }
    .mm-progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .mm-progress-row strong {
      color: var(--green);
      font-size: 14px;
    }
    .mm-progress-stuck {
      color: var(--mm-red);
      font-weight: 600;
    }
    .mm-meter {
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
      display: flex;
    }
    .mm-meter-mastered {
      background: var(--green);
      height: 100%;
      transition: width 0.25s ease;
    }
    .mm-meter-stuck {
      background: var(--mm-red);
      height: 100%;
      transition: width 0.25s ease;
    }

    .mm-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      margin-bottom: 14px;
    }
    .mm-tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mm-seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
    }
    .mm-seg button {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--muted);
      border-right: 1px solid var(--line);
    }
    .mm-seg button:last-child {
      border-right: 0;
    }
    .mm-seg button[aria-pressed="true"] {
      background: var(--green);
      color: var(--bg);
      font-weight: 600;
    }
    .mm-pill {
      min-height: 34px;
      padding: 5px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      transition: all 0.15s ease;
    }
    .mm-pill:hover {
      border-color: var(--green);
      color: var(--ink);
    }
    .mm-pill[aria-pressed="true"] {
      background: var(--soft);
      border-color: var(--green);
      color: var(--green);
      font-weight: 600;
    }
    .mm-pill[data-filter="red"][aria-pressed="true"] {
      background: var(--mm-red-bg);
      border-color: var(--mm-red-bd);
      color: var(--mm-red);
    }
    .mm-pill[data-filter="amber"][aria-pressed="true"] {
      background: var(--mm-amber-bg);
      border-color: var(--mm-amber-bd);
      color: var(--mm-amber);
    }
    .mm-pill[data-filter="blue"][aria-pressed="true"] {
      background: var(--mm-blue-bg);
      border-color: var(--mm-blue-bd);
      color: var(--mm-blue);
    }
    .mm-pill[data-filter="stuck"][aria-pressed="true"] {
      background: var(--mm-red-bg);
      border-color: var(--mm-red-bd);
      color: var(--mm-red);
    }
    .mm-search {
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      font-size: 12.5px;
      width: 210px;
    }
    .mm-act-btn {
      min-height: 34px;
      padding: 5px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
    }
    .mm-act-btn:hover {
      background: var(--soft);
      color: var(--green);
      border-color: var(--green);
    }

    .mm-legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .mm-legend-items {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .mm-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .mm-dot.red { background: var(--mm-red); }
    .mm-dot.amber { background: var(--mm-amber); }
    .mm-dot.blue { background: var(--mm-blue); }

    /* Mindmap Canvas */
    .mm-canvas-wrap {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--mm-shadow);
      overflow: hidden;
    }
    .mm-zoom-bar {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 15;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      box-shadow: var(--mm-shadow);
    }
    .mm-zoom-bar button {
      min-height: 30px;
      min-width: 30px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--ink);
    }
    .mm-zoom-bar button:hover {
      background: var(--soft);
      color: var(--green);
    }
    .mm-zoom-val {
      font-size: 11.5px;
      color: var(--muted);
      min-width: 42px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .mm-viewport {
      width: 100%;
      height: clamp(540px, 73vh, 880px);
      overflow: auto;
      cursor: grab;
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .mm-viewport.grabbing {
      cursor: grabbing;
      user-select: none;
    }
    .mm-scaler {
      position: relative;
      transform-origin: 0 0;
      margin: 0 auto;
    }
    .mm-stage {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      padding: 58px 40px 40px;
      min-width: 100%;
      transform-origin: 0 0;
    }
    .mm-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
    .mm-lines path {
      fill: none;
      stroke: var(--mm-line);
      stroke-width: 2;
      stroke-linecap: round;
    }
    .mm-lines path.is-root {
      stroke-width: 2.5;
      stroke: var(--green);
      opacity: 0.58;
    }
    .mm-lines path.is-red {
      stroke: var(--mm-red);
      opacity: 0.45;
    }

    .mm-root {
      position: relative;
      z-index: 2;
      width: 190px;
      flex: none;
      padding: 18px 18px;
      border-radius: 14px;
      background: var(--green);
      color: var(--bg);
      text-align: center;
      box-shadow: var(--mm-shadow);
    }
    .mm-root small {
      display: block;
      font-size: 10.5px;
      letter-spacing: 1.5px;
      opacity: 0.85;
      margin-bottom: 5px;
    }
    .mm-root h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: inherit;
    }
    .mm-root p {
      margin: 0;
      font-size: 12px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .mm-branches {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .mm-branch-row {
      display: flex;
      align-items: center;
      gap: 44px;
    }
    .mm-wing-left .mm-branch-row {
      flex-direction: row-reverse;
    }
    .mm-module {
      width: 196px;
      flex: none;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      box-shadow: var(--mm-shadow);
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .mm-module:hover {
      border-color: var(--green);
      background: var(--soft);
    }
    .mm-module-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .mm-module-code {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.5px;
    }
    .mm-module-count {
      font-size: 11px;
      color: var(--muted);
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .mm-module h3 {
      margin: 0 0 4px;
      font-size: 15px;
      font-family: var(--serif);
      color: var(--ink);
    }
    .mm-module-sub {
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .mm-leaves {
      display: flex;
      flex-direction: column;
      gap: 11px;
      width: 376px;
    }

    /* Leaf Card (shared between Mindmap & List views) */
    .leaf-card {
      position: relative;
      z-index: 2;
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: 11px;
      background: var(--bg);
      padding: 13px 15px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .leaf-card[data-tier="red"] { border-left-color: var(--mm-red); }
    .leaf-card[data-tier="amber"] { border-left-color: var(--mm-amber); }
    .leaf-card[data-tier="blue"] { border-left-color: var(--mm-blue); }
    .leaf-card.is-mastered {
      opacity: 0.86;
      background: var(--soft);
      border-color: var(--green);
    }
    .leaf-card.is-stuck {
      border-color: var(--mm-red-bd);
      box-shadow: 0 0 0 1px var(--mm-red-bd);
    }
    .leaf-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }
    .leaf-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tier-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid transparent;
    }
    .tier-badge.red {
      background: var(--mm-red-bg);
      border-color: var(--mm-red-bd);
      color: var(--mm-red);
    }
    .tier-badge.amber {
      background: var(--mm-amber-bg);
      border-color: var(--mm-amber-bd);
      color: var(--mm-amber);
    }
    .tier-badge.blue {
      background: var(--mm-blue-bg);
      border-color: var(--mm-blue-bd);
      color: var(--mm-blue);
    }
    .year-badge {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
    }
    .leaf-state-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--green);
    }
    .leaf-card.is-stuck .leaf-state-tag {
      color: var(--mm-red);
    }
    .leaf-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 5px;
      line-height: 1.45;
    }
    .leaf-prompt {
      font-size: 12.5px;
      color: var(--muted);
      margin: 0 0 9px;
      line-height: 1.6;
    }
    .leaf-prompt strong {
      color: var(--ink);
      font-weight: 600;
    }

    .leaf-veil {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px dashed var(--green);
      border-radius: 8px;
      background: var(--surface);
      color: var(--green);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 8px;
      transition: background 0.15s ease;
    }
    .leaf-veil:hover {
      background: var(--soft);
    }
    .leaf-answer {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      margin-bottom: 9px;
      font-size: 12.5px;
      line-height: 1.65;
    }
    .leaf-answer-main {
      color: var(--ink);
      margin-bottom: 6px;
    }
    .leaf-answer-main code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--soft);
      color: var(--green);
    }
    .leaf-pitfall {
      padding: 6px 9px;
      border-left: 3px solid var(--mm-red);
      background: var(--mm-red-bg);
      border-radius: 4px;
      font-size: 12px;
      color: var(--ink);
      line-height: 1.55;
    }
    .leaf-pitfall strong {
      color: var(--mm-red);
    }

    .leaf-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .leaf-status-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leaf-btn {
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 11.5px;
      color: var(--muted);
      background: var(--surface);
    }
    .leaf-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .leaf-btn.mastered-btn[aria-pressed="true"] {
      background: var(--green);
      border-color: var(--green);
      color: var(--bg);
      font-weight: 600;
    }
    .leaf-btn.stuck-btn[aria-pressed="true"] {
      background: var(--mm-red);
      border-color: var(--mm-red);
      color: #fff;
      font-weight: 600;
    }
    .leaf-link {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      color: var(--green);
    }
    .leaf-link:hover {
      background: var(--soft);
      text-decoration: underline;
    }

    /* List View */
    .mm-list-view {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .list-module {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--mm-shadow);
      overflow: hidden;
    }
    .list-module-head {
      width: 100%;
      min-height: 50px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .list-module-head[aria-expanded="false"] {
      border-bottom: 0;
    }
    .list-module-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .list-module-title h3 {
      margin: 0;
      font-size: 17px;
      font-family: var(--serif);
    }
    .list-module-body {
      padding: 14px 16px 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .mm-empty {
      padding: 40px 20px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13.5px;
      background: var(--surface);
    }

    html[data-theme="glass"] .mm-progress-box,
    html[data-theme="glass"] .mm-toolbar,
    html[data-theme="glass"] .mm-canvas-wrap,
    html[data-theme="glass"] .mm-module,
    html[data-theme="glass"] .list-module,
    html[data-theme="glass"] .mm-zoom-bar {
      background: rgba(14, 21, 31, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-color: rgba(255, 255, 255, 0.14);
    }
    html[data-theme="glass"] .leaf-card {
      background: rgba(10, 16, 25, 0.65);
    }
    html[data-theme="glass"] .leaf-answer,
    html[data-theme="glass"] .leaf-veil {
      background: rgba(17, 26, 38, 0.78);
    }

    @media (max-width: 960px) {
      .list-module-body {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 760px) {
      .mm-shell {
        padding: 12px 14px 40px;
      }
      .mm-title-wrap h1 {
        font-size: 22px;
      }
      .mm-progress-box {
        width: 100%;
        flex: 1 1 100%;
      }
      .mm-search {
        width: 100%;
      }
      .mm-viewport {
        height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div class="mm-shell">
    <header class="mm-topbar">

            answer: '<strong>核心结论：</strong>① 严禁跳过传输层（<code>DNS→UDP→IP</code>、<code>HTTP/FTP→TCP→IP</code>）。② 家庭拨号 PPPoE 或路由器广域网专线在链路层用 <strong>PPP</strong>：三部件为<strong>成帧 + LCP + NCP</strong>；只支持全双工点对点、无确认不可靠；透明传输：异步<strong>字节填充</strong>（<code>0x7D</code> 转义 <code>0x7E→7D 5E</code>），同步<strong>零比特填充</strong>（<strong>五 1 插 0</strong>）。',
            pitfall: '<strong>避坑红线：</strong>问“直接封装 DNS 的下层”答 <strong>UDP</strong>（不是 IP）；PPP 帧地址固定 <code>0xFF</code>，无 MAC 寻址。',
            href: 'network-6.html#section-34'
          },
          {
            id: 'c6-34',
            tier: 'amber',
            tag: '全章必背',
            title: '应用层 12 个高频熟知端口速背总表',
            prompt: '<strong>自测：</strong>闭眼报出 FTP(数据/控制)、TELNET、SMTP、DNS、DHCP(服/客)、TFTP、HTTP、POP3、IMAP、SNMP、HTTPS 各自的传输层协议与端口！',
            answer: '<strong>核心结论：</strong><strong>TCP 族：</strong>FTP 数据 <code>20</code> / 控制 <code>21</code>、TELNET <code>23</code>、SMTP <code>25</code>、HTTP <code>80</code>、POP3 <code>110</code>、IMAP <code>143</code>、HTTPS <code>443</code>。<br><strong>UDP 族：</strong>DNS <code>53</code>（常规）、DHCP <code>67</code>(服)/<code>68</code>(客)、TFTP <code>69</code>、SNMP <code>161</code>。',
            pitfall: '<strong>避坑红线：</strong>记牢“<strong>TFTP 69 / DHCP 67·68 / DNS 53 / SNMP 161 走 UDP</strong>”，尤其别把 HTTP(80) 与 FTP(20/21)、SMTP(25) 与 POP3(110) 搞混。',
            href: 'network-6.html#section-59'
          }
        ]
      }
    ];

    const TOTAL_COUNT = MODULES.reduce((sum, m) => sum + m.items.length, 0);
    const TIER_LABEL = { red: '真题红线', amber: '大纲核心', blue: '易错辨析' };

    let state = loadState();
    let recallMask = true;
    let viewMode = window.innerWidth <= 760 ? 'list' : 'map';
    let filterTier = 'all';
    let searchQuery = '';
    let collapsedModules = new Set();
    let revealedIds = new Set();
    let zoom = 1;

    const $ = s => document.querySelector(s);
    const mainEl = $('#mm-main');

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (raw && Array.isArray(raw.mastered) && Array.isArray(raw.stuck)) {
          return { mastered: new Set(raw.mastered), stuck: new Set(raw.stuck) };
        }
      } catch {}
      return { mastered: new Set(), stuck: new Set() };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          mastered: [...state.mastered],
          stuck: [...state.stuck]
        }));
      } catch {}
    }

    function readPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        return p && typeof p === 'object' && !Array.isArray(p) ? p : {};
      } catch {
        return {};
      }
    }

    function syncThemeButton() {
      const t = document.documentElement.dataset.theme || 'paper';
      const btn = $('#mm-theme-toggle');
      if (btn) btn.textContent = t === 'dark' ? '切回日间' : '切换夜读';
      const mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.content = THEME_COLORS[t] || '#f5f3ed';
    }

    $('#mm-theme-toggle').addEventListener('click', () => {
      const prefs = readPrefs();
      const cur = document.documentElement.dataset.theme || 'paper';
      const next = cur === 'dark' ? (DAY_THEMES.includes(prefs.dayTheme) ? prefs.dayTheme : 'paper') : 'dark';
      if (cur !== 'dark' && DAY_THEMES.includes(cur)) prefs.dayTheme = cur;
      prefs.theme = next;
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
      document.documentElement.dataset.theme = next;
      syncThemeButton();
    });

    function showToast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { t.hidden = true; }, 2200);
    }

    function matches(item) {
      if (filterTier === 'red' && item.tier !== 'red') return false;
      if (filterTier === 'amber' && item.tier !== 'amber') return false;
      if (filterTier === 'blue' && item.tier !== 'blue') return false;
      if (filterTier === 'stuck' && !state.stuck.has(item.id)) return false;
      const q = searchQuery.trim().toLowerCase();
      if (!q) return true;
      const hay = `${item.title} ${item.tag} ${item.prompt} ${item.answer} ${item.pitfall}`.replace(/<[^>]+>/g, '').toLowerCase();
      return hay.includes(q);
    }

    function updateStats() {
      const masteredN = state.mastered.size;
      const stuckN = state.stuck.size;
      $('#stat-mastered').textContent = masteredN;
      $('#stat-total').textContent = TOTAL_COUNT;
      $('#stat-stuck').textContent = stuckN;
      $('#meter-mastered').style.width = `${(masteredN / TOTAL_COUNT) * 100}%`;
      $('#meter-stuck').style.width = `${(stuckN / TOTAL_COUNT) * 100}%`;

      let redC = 0, amberC = 0, blueC = 0;
      for (const m of MODULES) {
        for (const it of m.items) {
          if (it.tier === 'red') redC++;
          else if (it.tier === 'amber') amberC++;
          else blueC++;
        }
      }
      $('#cnt-all').textContent = TOTAL_COUNT;
      $('#cnt-red').textContent = redC;
      $('#cnt-amber').textContent = amberC;
      $('#cnt-blue').textContent = blueC;
      $('#cnt-stuck').textContent = stuckN;

      $('#mode-recall').setAttribute('aria-pressed', String(recallMask));
      $('#mode-open').setAttribute('aria-pressed', String(!recallMask));
      $('#view-map').setAttribute('aria-pressed', String(viewMode === 'map'));
      $('#view-list').setAttribute('aria-pressed', String(viewMode === 'list'));
      document.querySelectorAll('[data-filter]').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.filter === filterTier));
      });
      const allCollapsed = MODULES.every(m => collapsedModules.has(m.id));
      $('#btn-toggle-all').textContent = allCollapsed ? '全部展开' : '全部折叠';
      $('#mm-hint-text').textContent = viewMode === 'map'
        ? '提示：点击中间模块可折叠分支，空白处可拖拽画布'
        : '提示：先看设问在脑中作答，点击虚线框翻牌核对';
    }

    function renderLeafCard(item) {
      const isMastered = state.mastered.has(item.id);
      const isStuck = state.stuck.has(item.id);
      const isRevealed = !recallMask || revealedIds.has(item.id);
      const stateTag = isStuck ? '⚑ 仍卡壳' : isMastered ? '✓ 已掌握' : '';

      return `
        <article class="leaf-card ${isMastered ? 'is-mastered' : ''} ${isStuck ? 'is-stuck' : ''}" data-id="${item.id}" data-tier="${item.tier}">
          <div class="leaf-meta">
            <div class="leaf-badges">
              <span class="tier-badge ${item.tier}">${TIER_LABEL[item.tier]}</span>
              <span class="year-badge">${item.tag}</span>
            </div>
            ${stateTag ? `<span class="leaf-state-tag">${stateTag}</span>` : ''}
          </div>
          <h4 class="leaf-title">${item.title}</h4>
          <p class="leaf-prompt">${item.prompt}</p>
          ${isRevealed ? `
            <div class="leaf-answer">
              <div class="leaf-answer-main">${item.answer}</div>
              <div class="leaf-pitfall">${item.pitfall}</div>
            </div>
          ` : `
            <button type="button" class="leaf-veil" data-action="reveal" data-id="${item.id}">
              点击翻牌核对核心结论与避坑红线
            </button>
          `}
          <div class="leaf-actions">
            <div class="leaf-status-btns">
              <button type="button" class="leaf-btn mastered-btn" data-action="mastered" data-id="${item.id}" aria-pressed="${isMastered}">✓ 已掌握</button>
              <button type="button" class="leaf-btn stuck-btn" data-action="stuck" data-id="${item.id}" aria-pressed="${isStuck}">⚑ 仍卡壳</button>
              ${recallMask && isRevealed ? `<button type="button" class="leaf-btn" data-action="hide" data-id="${item.id}">收起</button>` : ''}
            </div>
            <a class="leaf-link" href="${item.href}">回看原笔记 ↗</a>
          </div>
        </article>
      `;
    }

    function getFilteredModules() {
      return MODULES.map(m => ({
        ...m,
        visibleItems: m.items.filter(matches)
      })).filter(m => m.visibleItems.length > 0);
    }

    const LEFT_MODS = new Set(['m61', 'm62', 'm63']);
    let hasCenteredOnce = false;
    let panDrag = null;

    window.addEventListener('mousemove', e => {
      if (!panDrag) return;
      panDrag.vp.scrollLeft = panDrag.sLeft - (e.clientX - panDrag.startX);
      panDrag.vp.scrollTop = panDrag.sTop - (e.clientY - panDrag.startY);
    });
    window.addEventListener('mouseup', () => {
      if (!panDrag) return;
      panDrag.vp.classList.remove('grabbing');
      panDrag = null;
    });

    function buildBranchHtml(m) {
      const isCollapsed = collapsedModules.has(m.id);
      const masteredInMod = m.visibleItems.filter(it => state.mastered.has(it.id)).length;
      return `
        <div class="mm-branch-row" data-module-row="${m.id}">
          <button type="button" class="mm-module" data-action="toggle-module" data-mod="${m.id}" aria-expanded="${!isCollapsed}">
            <div class="mm-module-top">
              <span class="mm-module-code">${m.code}</span>
              <span class="mm-module-count">${masteredInMod}/${m.visibleItems.length}</span>
            </div>
            <h3>${m.title}</h3>
            <div class="mm-module-sub">
              <span>${isCollapsed ? '点击展开分支 ▸' : '点击收起分支 ▾'}</span>
              <span>${m.visibleItems.length} 个考点</span>
            </div>
          </button>
          ${isCollapsed ? '' : `
            <div class="mm-leaves" data-leaves-of="${m.id}">
              ${m.visibleItems.map(renderLeafCard).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderMapView(filtered) {
      if (!filtered.length) {
        mainEl.innerHTML = '<div class="mm-empty">当前筛选或搜索下没有匹配考点。点击「全部」或清空搜索框即可恢复。</div>';
        return;
      }
      const prevVp = $('#mm-viewport');
      const prevScroll = prevVp ? { left: prevVp.scrollLeft, top: prevVp.scrollTop } : null;

      const leftMods = filtered.filter(m => LEFT_MODS.has(m.id));
      const rightMods = filtered.filter(m => !LEFT_MODS.has(m.id));

      mainEl.innerHTML = `
        <div class="mm-canvas-wrap">
          <div class="mm-zoom-bar" aria-label="画布缩放控制">
            <button type="button" id="zoom-out" title="缩小">－</button>
            <span class="mm-zoom-val" id="zoom-label">${Math.round(zoom * 100)}%</span>
            <button type="button" id="zoom-in" title="放大">＋</button>
            <button type="button" id="zoom-center" title="居中定位">居中</button>
            <button type="button" id="zoom-fit" title="适配当前窗口">适配</button>
          </div>
          <div class="mm-viewport" id="mm-viewport">
            <div class="mm-scaler" id="mm-scaler">
              <div class="mm-stage" id="mm-stage">
                <svg class="mm-lines" id="mm-lines" aria-hidden="true"></svg>
                ${leftMods.length ? `<div class="mm-branches mm-wing-left" data-wing="left">${leftMods.map(buildBranchHtml).join('')}</div>` : ''}
                <div class="mm-root" id="mm-root">
                  <small>CH06 · 考纲 + 真题</small>
                  <h2>第6章 应用层</h2>
                  <p>6 个核心模块<br>34 个必会与防坑考点</p>
                </div>
                ${rightMods.length ? `<div class="mm-branches mm-wing-right" data-wing="right">${rightMods.map(buildBranchHtml).join('')}</div>` : ''}
              </div>
            </div>
          </div>
        </div>
      `;

      applyZoomAndConnectors();
      bindCanvasInteraction();

      if (!hasCenteredOnce) {
        hasCenteredOnce = true;
        const vp = $('#mm-viewport');
        const stage = $('#mm-stage');
        if (vp && stage && stage.scrollWidth > vp.clientWidth - 20) {
          const fitW = Math.max(0.68, Math.min(0.95, (vp.clientWidth - 28) / stage.scrollWidth));
          zoom = Number(fitW.toFixed(2));
          applyZoomAndConnectors();
        }
        requestAnimationFrame(() => centerRootInViewport(false));
      } else if (prevScroll) {
        const vp = $('#mm-viewport');
        if (vp) {
          vp.scrollLeft = prevScroll.left;
          vp.scrollTop = prevScroll.top;
        }
      }
    }

    function renderListView(filtered) {
      if (!filtered.length) {
        mainEl.innerHTML = '<div class="mm-empty">当前筛选或搜索下没有匹配考点。点击「全部」或清空搜索框即可恢复。</div>';
        return;
      }
      mainEl.innerHTML = `
        <div class="mm-list-view">
          ${filtered.map(m => {
            const isCollapsed = collapsedModules.has(m.id);
            const masteredInMod = m.visibleItems.filter(it => state.mastered.has(it.id)).length;
            return `
              <section class="list-module" data-mod="${m.id}">
                <button type="button" class="list-module-head" data-action="toggle-module" data-mod="${m.id}" aria-expanded="${!isCollapsed}">
                  <div class="list-module-title">
                    <span class="mm-module-code">${m.code}</span>
                    <h3>${m.title}</h3>
                    <span class="mm-module-count">已掌握 ${masteredInMod}/${m.visibleItems.length}</span>
                  </div>
                  <span style="font-size:12px;color:var(--muted)">${isCollapsed ? '展开 ▸' : '收起 ▾'}</span>
                </button>
                ${isCollapsed ? '' : `
                  <div class="list-module-body">
                    ${m.visibleItems.map(renderLeafCard).join('')}
                  </div>
                `}
              </section>
            `;
          }).join('')}
        </div>
      `;
    }

    function drawConnectors() {
      const stage = $('#mm-stage');
      const svg = $('#mm-lines');
      const root = $('#mm-root');
      if (!stage || !svg || !root) return;

      const w = stage.scrollWidth;
      const h = stage.scrollHeight;
      svg.setAttribute('width', String(w));
      svg.setAttribute('height', String(h));
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      const sRect = stage.getBoundingClientRect();
      const rRect = root.getBoundingClientRect();
      const rLeft = (rRect.left - sRect.left) / zoom;
      const rRight = (rRect.right - sRect.left) / zoom;
      const ry = (rRect.top + rRect.height / 2 - sRect.top) / zoom;

      const paths = [];
      stage.querySelectorAll('.mm-branch-row').forEach(row => {
        const modBtn = row.querySelector('.mm-module');
        if (!modBtn) return;
        const isLeft = !!row.closest('[data-wing="left"]');
        const mRect = modBtn.getBoundingClientRect();
        const mLeft = (mRect.left - sRect.left) / zoom;
        const mRight = (mRect.right - sRect.left) / zoom;
        const my = (mRect.top + mRect.height / 2 - sRect.top) / zoom;

        if (isLeft) {
          const c1x = rLeft + (mRight - rLeft) * 0.48;
          paths.push(`<path class="is-root" d="M ${rLeft.toFixed(1)} ${ry.toFixed(1)} C ${c1x.toFixed(1)} ${ry.toFixed(1)}, ${c1x.toFixed(1)} ${my.toFixed(1)}, ${mRight.toFixed(1)} ${my.toFixed(1)}" />`);

          row.querySelectorAll('.leaf-card').forEach(card => {
            const cRect = card.getBoundingClientRect();
            const lRight = (cRect.right - sRect.left) / zoom;
            const ly = (cRect.top + cRect.height / 2 - sRect.top) / zoom;
            const cx = mLeft + (lRight - mLeft) * 0.48;
            const cls = card.dataset.tier === 'red' ? 'is-red' : '';
            paths.push(`<path class="${cls}" d="M ${mLeft.toFixed(1)} ${my.toFixed(1)} C ${cx.toFixed(1)} ${my.toFixed(1)}, ${cx.toFixed(1)} ${ly.toFixed(1)}, ${lRight.toFixed(1)} ${ly.toFixed(1)}" />`);
          });
        } else {
          const c1x = rRight + (mLeft - rRight) * 0.48;
          paths.push(`<path class="is-root" d="M ${rRight.toFixed(1)} ${ry.toFixed(1)} C ${c1x.toFixed(1)} ${ry.toFixed(1)}, ${c1x.toFixed(1)} ${my.toFixed(1)}, ${mLeft.toFixed(1)} ${my.toFixed(1)}" />`);

          row.querySelectorAll('.leaf-card').forEach(card => {
            const cRect = card.getBoundingClientRect();
            const lLeft = (cRect.left - sRect.left) / zoom;
            const ly = (cRect.top + cRect.height / 2 - sRect.top) / zoom;
            const cx = mRight + (lLeft - mRight) * 0.48;
            const cls = card.dataset.tier === 'red' ? 'is-red' : '';
            paths.push(`<path class="${cls}" d="M ${mRight.toFixed(1)} ${my.toFixed(1)} C ${cx.toFixed(1)} ${my.toFixed(1)}, ${cx.toFixed(1)} ${ly.toFixed(1)}, ${lLeft.toFixed(1)} ${ly.toFixed(1)}" />`);
          });
        }
      });

      svg.innerHTML = paths.join('');
    }

    function applyZoomAndConnectors() {
      const stage = $('#mm-stage');
      const scaler = $('#mm-scaler');
      const label = $('#zoom-label');
      if (!stage || !scaler) return;

      stage.style.transform = `scale(${zoom})`;
      scaler.style.width = `${Math.ceil(stage.scrollWidth * zoom)}px`;
      scaler.style.height = `${Math.ceil(stage.scrollHeight * zoom)}px`;
      if (label) label.textContent = `${Math.round(zoom * 100)}%`;

      requestAnimationFrame(drawConnectors);
    }

    function centerRootInViewport(smooth) {
      const vp = $('#mm-viewport');
      const root = $('#mm-root');
      if (!vp || !root) return;
      const vpRect = vp.getBoundingClientRect();
      const rRect = root.getBoundingClientRect();
      const targetLeft = vp.scrollLeft + (rRect.left + rRect.width / 2) - (vpRect.left + vpRect.width / 2);
      const targetTop = vp.scrollTop + (rRect.top + rRect.height / 2) - (vpRect.top + vpRect.height / 2);
      vp.scrollTo({
        left: Math.max(0, targetLeft),
        top: Math.max(0, targetTop),
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    function bindCanvasInteraction() {
      const vp = $('#mm-viewport');
      if (!vp) return;

      vp.addEventListener('mousedown', e => {
        if (e.button !== 0 || e.target.closest('button, a, input, .leaf-card, .mm-module, .mm-root')) return;
        vp.classList.add('grabbing');
        panDrag = { vp, startX: e.clientX, startY: e.clientY, sLeft: vp.scrollLeft, sTop: vp.scrollTop };
      });

      const zoomIn = $('#zoom-in');
      const zoomOut = $('#zoom-out');
      const zoomCenter = $('#zoom-center');
      const zoomFit = $('#zoom-fit');
      if (zoomIn) zoomIn.addEventListener('click', () => {
        zoom = Math.min(1.35, Number((zoom + 0.1).toFixed(2)));
        applyZoomAndConnectors();
      });
      if (zoomOut) zoomOut.addEventListener('click', () => {
        zoom = Math.max(0.3, Number((zoom - 0.1).toFixed(2)));
        applyZoomAndConnectors();
      });
      if (zoomCenter) zoomCenter.addEventListener('click', () => {
        centerRootInViewport(true);
      });
      if (zoomFit) zoomFit.addEventListener('click', () => {
        const stage = $('#mm-stage');
        if (!stage) return;
        const ratio = Math.min(
          (vp.clientWidth - 16) / stage.scrollWidth,
          (vp.clientHeight - 16) / stage.scrollHeight,
          1
        );
        zoom = Math.max(0.28, Number(ratio.toFixed(2)));
        applyZoomAndConnectors();
        requestAnimationFrame(() => centerRootInViewport(true));
      });
    }

    function renderAll() {
      updateStats();
      const filtered = getFilteredModules();
      if (viewMode === 'map') {
        renderMapView(filtered);
      } else {
        renderListView(filtered);
      }
    }

    mainEl.addEventListener('click', e => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === 'reveal') {
        revealedIds.add(id);
        renderAll();
      } else if (action === 'hide') {
        revealedIds.delete(id);
        renderAll();
      } else if (action === 'mastered') {
        if (state.mastered.has(id)) {
          state.mastered.delete(id);
        } else {
          state.mastered.add(id);
          state.stuck.delete(id);
          revealedIds.add(id);
        }
        saveState();
        renderAll();
      } else if (action === 'stuck') {
        if (state.stuck.has(id)) {
          state.stuck.delete(id);
        } else {
          state.stuck.add(id);
          state.mastered.delete(id);
          revealedIds.add(id);
        }
        saveState();
        renderAll();
      } else if (action === 'toggle-module') {
        const mod = target.dataset.mod;
        if (collapsedModules.has(mod)) collapsedModules.delete(mod);
        else collapsedModules.add(mod);
        renderAll();
      }
    });

    $('#mode-recall').addEventListener('click', () => {
      recallMask = true;
      revealedIds.clear();
      renderAll();
    });
    $('#mode-open').addEventListener('click', () => {
      recallMask = false;
      renderAll();
    });
    $('#view-map').addEventListener('click', () => {
      viewMode = 'map';
      hasCenteredOnce = false;
      renderAll();
    });
    $('#view-list').addEventListener('click', () => {
      viewMode = 'list';
      renderAll();
    });
    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        filterTier = btn.dataset.filter;
        hasCenteredOnce = false;
        renderAll();
      });
    });
    $('#mm-search').addEventListener('input', e => {
      searchQuery = e.target.value;
      hasCenteredOnce = false;
      renderAll();
    });
    $('#btn-toggle-all').addEventListener('click', () => {
      const allCollapsed = MODULES.every(m => collapsedModules.has(m.id));
      if (allCollapsed) collapsedModules.clear();
      else MODULES.forEach(m => collapsedModules.add(m.id));
      hasCenteredOnce = false;
      renderAll();
    });
    $('#btn-reset').addEventListener('click', () => {
      if (!confirm('确认清空第6章导图的“已掌握 / 仍卡壳”进度记录吗？')) return;
      state = { mastered: new Set(), stuck: new Set() };
      revealedIds.clear();
      saveState();
      renderAll();
      showToast('已重置第6章导图自测进度');
    });

    window.addEventListener('resize', () => {
      if (viewMode === 'map') applyZoomAndConnectors();
    });

    syncThemeButton();
    renderAll();
  })();
  </script>
</body>
</html>

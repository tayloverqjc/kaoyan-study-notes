<!doctype html><html lang="zh-CN" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ed"><meta name="description" content="个人学习台：作文背诵、间隔复习与408章节笔记。"><title>复习手册 · 每日学习</title><script src="study/theme-boot.js?v=1"></script><link rel="stylesheet" href="study/app.css?v=1"></head><body>
<aside class="app-rail" aria-label="主导航"><a class="brand" href="index.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4zM13 7a3 3 0 0 1 3-3h5v14h-4a4 4 0 0 0-4 3"/></svg>复习手册</a><nav class="app-nav"><a href="index.html" data-nav="today"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 11h16m-11 5 2 2 4-4"/></svg><span>今日</span></a><a href="english.html" data-nav="library"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M9 4v16m5-15 6 15M2 4h4M7 4h4M2 20h4M7 20h4"/></svg><span>作文篇库</span></a><a href="notes.html" data-nav="notes"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg><span>笔记书架</span></a><a href="method.html" data-nav="method"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v18M5 5h13l-3 4 3 4H5"/></svg><span>计划与方法</span></a></nav><div class="rail-note">一点回忆，一点积累。<br>让每一遍，都有下一次。</div></aside>
<main class="app-main"><header class="app-top"><a class="mobile-brand" href="index.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4zM13 7a3 3 0 0 1 3-3h5v14h-4a4 4 0 0 0-4 3"/></svg>复习手册</a><span id="date-display" class="date-display"></span><div class="top-actions"><button class="icon-button" id="theme-button" aria-label="切换夜读"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg></button><button class="icon-button" data-settings aria-label="计划设置与备份"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></div></header><div id="view" aria-live="polite"><p class="muted">正在打开学习资料…</p></div><p class="footer-note">学习记录保存在本浏览器 · 可通过设置导出备份</p></main>
<button class="focus-exit" id="focus-exit" hidden>退出专注</button>
<dialog id="settings-dialog"><div class="dialog-header"><h2>按自己的节奏</h2><button type="button" class="icon-button" data-close="settings-dialog" aria-label="关闭"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><form id="settings-form"><div class="form-row"><label for="start-date">首轮开始日期</label><input type="date" id="start-date" required></div><div class="form-row"><label for="daily-new">每天新学</label><select id="daily-new"><option value="1">1 篇 · 循序渐进</option><option value="2">2 篇 · 加快首轮</option></select></div><p class="dialog-help">调整只改变新篇安排；已保存的复习时间继续保留。</p><button class="primary" type="submit">保存计划</button></form><div class="form-row"><span>专注计时</span><button class="secondary" id="timer-reset" type="button">重置为 20 分钟</button></div><div class="app-theme-section"><h3>界面风格</h3><p class="dialog-help">与全部阅读页共享并跨设备同步，切换即刻生效。</p><div class="app-theme-grid" aria-label="界面风格"><button type="button" data-app-theme="paper" aria-pressed="true"><i></i><span>暖纸书</span></button><button type="button" data-app-theme="focus" aria-pressed="false"><i></i><span>专注精读</span></button><button type="button" data-app-theme="mono" aria-pressed="false"><i></i><span>极简黑白</span></button><button type="button" data-app-theme="glass" aria-pressed="false"><i></i><span>暮光玻璃</span></button><button type="button" data-app-theme="momo" aria-pressed="false"><i></i><span>墨墨护眼</span></button><button type="button" data-app-theme="light" aria-pressed="false"><i></i><span>纯白</span></button><button type="button" data-app-theme="dark" aria-pressed="false"><i></i><span>夜读</span></button></div><div class="app-wallpaper-picker"><p class="dialog-help" style="margin:0">暮光玻璃壁纸（跨设备同步）</p><div class="app-wallpaper-grid" aria-label="选择暮光壁纸"><button type="button" data-app-wallpaper="lake" aria-pressed="true"><span>雪山暮色</span></button><button type="button" data-app-wallpaper="coast" aria-pressed="false"><span>橘海落日</span></button><button type="button" data-app-wallpaper="forest" aria-pressed="false"><span>松林晨雾</span></button></div></div></div><h3>记录与备份</h3><p class="dialog-help" id="storage-state"></p><div class="backup-buttons"><button class="secondary" id="export-data" type="button">导出备份</button><button class="secondary" id="import-data" type="button">导入备份</button></div><input id="import-file" type="file" accept="application/json,.json" hidden></dialog>
<dialog id="supplement-dialog"><div class="dialog-header"><h2>补齐这一篇</h2><button type="button" class="icon-button" data-close="supplement-dialog" aria-label="关闭"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><p class="dialog-help">请从你持有的原文补录英文范文，以空行分段。补录只保存在当前浏览器，不会上传或改写网站资料；会随备份一并导出。</p><form id="supplement-form"><input id="supplement-id" type="hidden"><label for="supplement-text">英文范文</label><textarea class="draft" id="supplement-text" required lang="en" placeholder="按原文录入，以空行分段。"></textarea><button class="primary" type="submit">保存并加入本机计划</button></form></dialog>
<dialog id="import-dialog"><div class="dialog-header"><h2>确认导入备份</h2><button type="button" class="icon-button" data-close="import-dialog" aria-label="关闭"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><p class="dialog-help" id="import-preview"></p><div class="button-row"><button class="primary" id="confirm-import">替换并导入</button><button class="secondary" data-close="import-dialog">取消</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><script type="module" src="study/app.js?v=1"></script></body></html>
